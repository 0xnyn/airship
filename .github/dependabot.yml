version: 2

# dependabot/* is on branch-policy.yml's allowlist precisely so these PRs can
# target main without a release branch.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # Biome 2.6 renamed the nursery rule `useSortedClasses` to
      # `useTailwindSortedClasses`, and Biome exits on an unknown rule key.
      # Ultracite's shipped config (ultracite/biome/core) still uses the old
      # name as of ultracite 8.0.2, so with 2.6 every `pnpm lint` dies before
      # checking a file. Lift this once an ultracite release names the new
      # rule — check `node_modules/ultracite/config/biome/core/biome.jsonc` —
      # and widen `~2.5.15` in package.json at the same time.
      - dependency-name: "@biomejs/biome"
        versions: [">=2.6.0"]
      # typescript@7 is the native compiler and ships no JavaScript API; the
      # `--dts` step of every package's tsup build loads rollup-plugin-dts,
      # which needs one, and dies with "Cannot read properties of undefined
      # (reading 'useCaseSensitiveFileNames')". Lift this when tsup's dts
      # path works against 7 (TypeScript 7.1 is where an API is promised),
      # or alias `typescript` to `npm:@typescript/typescript6` for the tools
      # and run `@typescript/native` as tsc, as the 7.0 announcement suggests.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # Minor and patch bumps land as one PR; majors stay individual so a
      # breaking change is never buried in a batch of twelve.
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
